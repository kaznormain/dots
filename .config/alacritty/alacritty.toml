# Add the following line to ~\AppData\Roaming\alacritty\alacritty.toml on Windows
# general.import = ["~/Documents/alacritty/alacritty.toml"]

#general.import = ["themes/tokyo_night_moon.toml"]
general.import = ["themes/gruvbox_dark.toml"]

[font]
size = 10.0
offset.x = 1
offset.y = 0
glyph_offset.x = 0
glyph_offset.y = 0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
#startup_mode = "Fullscreen"
#decorations = "None"
#opacity = 0.5
title = "Alacritty"
dynamic_title = false

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Underline", blinking = "On" }
blink_timeout = 0

[[keyboard.bindings]]
key = "v"
mods = "Alt"
mode = "~Vi"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "v"
mods = "Alt"
mode = "Vi"
action = "ToggleViMode"
