set -g mouse on 
set -g set-clipboard on 
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
#set -g default-terminal "xterm-256color"
#set -as terminal-features ",xterm-256color:RGB"
#set -as terminal-features ",alacritty:RGB"

# To install a plugin, add new lines with following example, then press <prefix> + I
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
#
# To update plugins, press <prefix> + U
#
# To unistall a plugin, remove it from the list below, then press <prefix> + <A-u>
#
# The default tmux <prefix> is <C-b>. All plugins would be installed to ~/.tmux/plugins

# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# tmux gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
